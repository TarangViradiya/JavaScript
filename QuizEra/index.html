<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>QuizEra</title>
    <link rel="icon" href="images/Logo-white.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        @font-face {
            font-family: 'ComicRelif-Bold';
            src: url(fonts/Comic_Relief/ComicRelief-Bold.ttf);
        }

        @font-face {
            font-family: 'ComicRelif-Reg';
            src: url(fonts/Comic_Relief/ComicRelief-Regular.ttf);
        }

        /* ---------- BASE ---------- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        html, body {
            height: 100%;
            background: #0a0a0a;
        }

        /* ---------- CANVAS ---------- */
        #space {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: none;
        }

        body {
            color: #fff;
            position: relative;
        }

        nav, main {
            position: relative;
            z-index: 2;
        }

        /* ---------- NAVBAR ---------- */
        nav {
            background: rgba(0, 0, 0, 0.35);
            padding: 15px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            backdrop-filter: blur(3px);
        }

        nav h1 {
            font-family: ComicRelif-Bold;
            font-size: 24px;
        }

        nav ul {
            list-style: none;
            display: flex;
            gap: 25px;
        }

        nav ul li:hover {
            color: #ffd369;
            cursor: pointer;
        }

        /* ---------- MAIN ---------- */
        main {
            padding: 60px 20px;
            text-align: center;
        }

        /* ---------- ANIMATED HEADING ---------- */
        .content {
            position: relative;
            height: 140px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .content h2 {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            font-size: 3.2rem;
            font-family: ComicRelif-Bold;
            text-align: center;
        }

        .content h2:nth-child(1) {
            color: transparent;
            -webkit-text-stroke: 2px rgb(212,168,87);
        }

        .content h2:nth-child(2) {
            color: rgb(211, 173, 104);
            animation: animate 4s ease-in-out infinite;
        }

        @keyframes animate {
            0%, 100% {
                clip-path: polygon(0% 45%,16% 44%,33% 50%,54% 60%,70% 61%,84% 59%,100% 52%,100% 100%,0% 100%);
            }
            50% {
                clip-path: polygon(0% 60%,15% 65%,34% 66%,51% 62%,67% 50%,84% 45%,100% 46%,100% 100%,0% 100%);
            }
        }

        /* ---------- LEVEL SELECTOR ---------- */
        .levels {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 15px 0 35px;
        }

        .level-btn {
            padding: 10px 22px;
            border-radius: 30px;
            border: 1px solid rgba(255,211,105,0.4);
            background: transparent;
            color: #ffd369;
            cursor: pointer;
            font-size: 15px;
            transition: 0.3s;
        }

        .level-btn:hover {
            background: rgba(255,211,105,0.15);
        }

        .level-btn.active {
            background: linear-gradient(135deg,#ffd369,#ffb703);
            color: #000;
            font-weight: bold;
        }

        /* ---------- SUBJECT CARDS ---------- */
        .subjects {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 25px;
            max-width: 1000px;
            margin: auto;
        }

        .card-btn {
            background: linear-gradient(145deg, #ffffff07, #ffffff11);
            border: none;
            border-radius: 20px;
            padding: 30px;
            backdrop-filter: blur(2px);
            color: #fff;
            cursor: pointer;
            transition: 0.4s;
        }

        .card-btn:hover {
            transform: translateY(-10px) scale(1.03);
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }

        .card-btn h3 {
            margin-top: 15px;
            font-size: 22px;
        }

        /* ---------- MOBILE ---------- */
        @media (max-width:600px) {
            nav {
                flex-direction: column;
                gap: 10px;
            }

            .content h2 {
                font-size: 2rem;
            }

            .levels {
                flex-wrap: wrap;
            }
        }
    </style>
</head>

<body>

    <!-- PARTICLE CANVAS -->
    <canvas id="space"></canvas>

    <!-- NAVBAR -->
    <nav>
        <h1>QuizEra</h1>
        <ul>
            <li>Home</li>
            <li>Quizzes</li>
            <li>About</li>
            <li>Contact</li>
        </ul>
    </nav>

    <!-- MAIN -->
    <main>

        <section>
            <div class="content">
                <h2>Select Your Subject 🎯</h2>
                <h2>Select Your Subject 🎯</h2>
            </div>
        </section>

        <p style="font-family: ComicRelif-Reg;margin-bottom: 50px;">
            Click on any one topic and select the difficulty level to start the Quiz
        </p>


        
        <div class="subjects">
            <button class="card-btn" onclick="SelectSubject('html')">
                <img src="images/html.png" height="120">
                <h3>HTML</h3>
            </button>

            <button class="card-btn" onclick="SelectSubject('css')">
                <img src="images/css.png" height="120">
                <h3>CSS</h3>
            </button>

            <button class="card-btn" onclick="SelectSubject('js')">
                <img src="images/js.png" height="120">
                <h3>JavaScript</h3>
            </button>

            <button class="card-btn" onclick="SelectSubject('react')">
                <img src="images/react.png" height="120">
                <h3>React Js</h3>
            </button>
        </div>
        <br>
        <div class="levels">
            <button class="level-btn active" onclick="setLevel(event,'easy')">Easy</button>
            <button class="level-btn" onclick="setLevel(event,'medium')">Medium</button>
            <button class="level-btn" onclick="setLevel(event,'hard')">Hard</button>
        </div>

    </main>

    <script>

        // let selectedLevel = "easy";

        // function setLevel(e, level) {
        //     selectedLevel = level;
        //     document.querySelectorAll(".level-btn").forEach(btn =>
        //         btn.classList.remove("active")
        //     );
        //     e.target.classList.add("active");
        // }

        // function SelectSubject(subject) {
        //     alert(`Selected: ${subject.toUpperCase()} | ${selectedLevel.toUpperCase()}`);
        //     window.location.href =
        //         `Quiz.html?subject=${subject}&level=${selectedLevel}`;
        // }

        let selectedLevel = 'easy' 
        let LevelButtons = document.querySelectorAll(".level-btn")

        function setLevel(e,val) {
            
            selectedLevel = val

            LevelButtons.forEach((btn)=>{
                btn.classList.remove("active")
            })

            e.target.classList.add("active")

        }

        function SelectSubject(val){

            alert(`You selected ${val.toUpperCase()} and Your difficulty level is ${selectedLevel.toUpperCase()}`)

            window.location.href = `Quiz.html?subject=${val}&level=${selectedLevel}`
        }



    </script>

    <!-- ---------- PARTICLE JS ---------- -->
    <script>
        const canvas = document.getElementById("space");
        const ctx = canvas.getContext("2d");

        let w, h, dpr;

        function resize() {
            dpr = window.devicePixelRatio || 1;
            w = window.innerWidth;
            h = window.innerHeight;
            canvas.width = w * dpr;
            canvas.height = h * dpr;
            canvas.style.width = w + "px";
            canvas.style.height = h + "px";
            ctx.setTransform(1,0,0,1,0,0);
            ctx.scale(dpr,dpr);
        }
        resize();
        window.addEventListener("resize", resize);

        const particles = [];
        for (let i = 0; i < 120; i++) {
            particles.push({
                x: Math.random() * w,
                y: Math.random() * h,
                size: Math.random() * 2 + 1,
                speed: Math.random() * 0.6 + 0.2,
                glow: Math.random() * 0.3 + 0.7,
                hue: Math.random() * 40 + 20,
                phase: Math.random() * Math.PI * 2
            });
        }

        function draw() {
            ctx.clearRect(0,0,canvas.width,canvas.height);
            const time = Date.now();

            particles.forEach(p => {
                p.y -= p.speed;
                if (p.y < -10) p.y = h + 10;
                const pulse = p.size + Math.sin(time * 0.003 + p.phase) * 0.3;
                ctx.beginPath();
                ctx.fillStyle = `hsla(${p.hue},100%,70%,${p.glow})`;
                ctx.arc(p.x,p.y,pulse,0,Math.PI*2);
                ctx.fill();
            });
            requestAnimationFrame(draw);
        }
        draw();
    </script>

    
    

</body>
</html>
